name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check plugin metadata
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool hooks/hooks.json >/dev/null
          test -d shared/gurumaker
          for skill in research memory decision train packs; do
            test -f "skills/$skill/SKILL.md"
            test "$(sed -n '2p' "skills/$skill/SKILL.md")" = "name: $skill"
          done
          test "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d '[:space:]')" = 5
          test -f shared/gurumaker/references/runtime.md
          test -x shared/gurumaker/scripts/gurumaker.sh
          test -x hooks/run-hook.sh
          sh -n shared/gurumaker/scripts/gurumaker.sh
          sh -n hooks/run-hook.sh
          test -f target/release/gurumaker

      - name: Test isolated Runtime environment
        run: GURUMAKER_TEST_RUNTIME_BIN="$PWD/target/release/gurumaker" scripts/test-env.sh

  msrv:
    name: Rust 1.82 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Test minimum supported Rust
        run: cargo test --all-targets --locked

  host-wrappers:
    name: Runtime wrapper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Runtime
        run: cargo build --locked

      - name: Test POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export GURUMAKER_RUNTIME_BIN="$PWD/target/debug/gurumaker"
          sh shared/gurumaker/scripts/gurumaker.sh --runtime-status
          test "$(sh shared/gurumaker/scripts/gurumaker.sh --version)" = \
            "$(tr -d '[:space:]' < shared/gurumaker/runtime/version)"
          export HOOK_WORKSPACE="$RUNNER_TEMP/guru-maker-hook-workspace"
          target/debug/gurumaker init "$HOOK_WORKSPACE"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          HOOK_INPUT=$(
            python3 -c 'import json, os; print(json.dumps({
              "cwd": os.environ["HOOK_WORKSPACE"],
              "hook_event_name": "PreToolUse",
              "tool_name": "Write",
              "tool_input": {
                "file_path": os.path.join(
                  os.environ["HOOK_WORKSPACE"],
                  ".guru-maker/packs/lens/element.md"
                )
              }
            }))'
          )
          set +e
          printf '%s' "$HOOK_INPUT" |
            (
              cd "$HOOK_WORKSPACE"
              sh "$CLAUDE_PLUGIN_ROOT/hooks/run-hook.sh" pre-tool-use
            )
          HOOK_STATUS=$?
          set -e
          test "$HOOK_STATUS" -eq 2

      - name: Test PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GURUMAKER_RUNTIME_BIN = (
            Resolve-Path "target/debug/gurumaker.exe"
          ).Path
          & "shared/gurumaker/scripts/gurumaker.ps1" --runtime-status
          $actual = & "shared/gurumaker/scripts/gurumaker.ps1" --version
          $expected = (
            Get-Content "shared/gurumaker/runtime/version" -Raw
          ).Trim()
          if ($actual.Trim() -ne $expected) {
            throw "Runtime wrapper returned $actual, expected $expected"
          }

          Remove-Item Env:GURUMAKER_RUNTIME_BIN
          $target = "x86_64-pc-windows-msvc"
          $releaseBasePath = Join-Path $env:RUNNER_TEMP "releases/download"
          $releaseDirectory = Join-Path $releaseBasePath "v$expected"
          $env:GURUMAKER_RUNTIME_HOME = Join-Path $env:RUNNER_TEMP "runtime-home"
          New-Item -ItemType Directory -Force -Path $releaseDirectory |
            Out-Null
          $artifact = "gurumaker-$target.exe"
          Copy-Item "target/debug/gurumaker.exe" (
            Join-Path $releaseDirectory $artifact
          )
          $hash = (
            Get-FileHash -Algorithm SHA256 (
              Join-Path $releaseDirectory $artifact
            )
          ).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii (
            Join-Path $releaseDirectory "SHA256SUMS"
          ) "$hash  $artifact"
          $env:GURUMAKER_RELEASE_BASE_URL = (
            [Uri]::new(
              (Resolve-Path $releaseBasePath).Path +
              [IO.Path]::DirectorySeparatorChar
            ).AbsoluteUri
          ).TrimEnd("/")

          & "shared/gurumaker/scripts/gurumaker.ps1" --runtime-install
          $installedVersion = & "shared/gurumaker/scripts/gurumaker.ps1" --version
          if ($installedVersion.Trim() -ne $expected) {
            throw "Installed Runtime returned $installedVersion, expected $expected"
          }

          $hookWorkspace = Join-Path $env:RUNNER_TEMP "guru-maker-hook-workspace"
          & "target/debug/gurumaker.exe" init $hookWorkspace
          $env:CLAUDE_PLUGIN_ROOT = (Get-Location).Path
          $hookInput = @{
            cwd = $hookWorkspace
            hook_event_name = "PreToolUse"
            tool_name = "Write"
            tool_input = @{
              file_path = Join-Path $hookWorkspace `
                ".guru-maker/packs/lens/element.md"
            }
          } | ConvertTo-Json -Compress -Depth 4
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Get-Command pwsh).Source
          $startInfo.ArgumentList.Add("-NoProfile")
          $startInfo.ArgumentList.Add("-ExecutionPolicy")
          $startInfo.ArgumentList.Add("Bypass")
          $startInfo.ArgumentList.Add("-File")
          $startInfo.ArgumentList.Add(
            (Resolve-Path "hooks/run-hook.ps1").Path
          )
          $startInfo.ArgumentList.Add("pre-tool-use")
          $startInfo.WorkingDirectory = $hookWorkspace
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.StandardInput.Write($hookInput)
          $process.StandardInput.Close()
          $process.WaitForExit()
          if ($process.ExitCode -ne 2) {
            $stderr = $process.StandardError.ReadToEnd()
            throw "Hook returned $($process.ExitCode), expected 2: $stderr"
          }
