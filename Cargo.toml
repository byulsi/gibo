[package]
name = "gibo"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Gibo: project-owned investment memory and Gibo Pack CLI"
license = "Apache-2.0"
publish = false
readme = "README.md"
homepage = "https://github.com/byulsi/gibo"
repository = "https://github.com/byulsi/gibo"
keywords = ["investment", "research", "knowledge", "agents"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "gibo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
