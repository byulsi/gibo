[package]
name = "guru-maker"
version = "0.0.2"
edition = "2021"
rust-version = "1.82"
description = "Project-owned investment memory and Guru Pack CLI"
license = "Apache-2.0"
publish = false
readme = "README.md"
homepage = "https://github.com/monarchjuno/guru-maker"
repository = "https://github.com/monarchjuno/guru-maker"
keywords = ["investment", "research", "knowledge", "agents"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "gurumaker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
